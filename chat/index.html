<div class="wrap"><div class="crumb"><a href="../">‹ 홈</a></div><div class="hero" style="padding-top:30px"><div class="eyebrow">실시간</div><h1>공유 채팅</h1><p class="lead">현장에서 문제가 생기면 사진과 내용을 바로 보내 주세요. 모두에게 공유됩니다.</p></div><div class="note warn" id="cnote" style="display:none"><b>총괄 서버 연결 전입니다.</b> 서버 설정이 끝나면 이 화면에서 사진과 메시지를 보낼 수 있습니다. 급하면 종합상황실(010-6693-5720)로 전화해 주세요.</div><div class="msgs" id="msgs"></div><div class="composer" id="comp"><div class="in"><textarea id="tx" placeholder="문제 상황을 적어 주세요 (예: 고장 · 위치 · 인원)"></textarea><div class="bar"><input class="nm" id="cn" placeholder="이름 / 소속"><label class="btn ghost" style="margin:0;padding:10px 16px;font-size:16px;cursor:pointer">사진<input type="file" id="pf" accept="image/*" capture="environment" style="display:none"></label><img class="thumb" id="th" style="display:none" alt="미리보기"><button class="btn" id="sd" type="button">보내기</button></div></div></div><script>window.addEventListener("load",function(){
var box=document.getElementById('msgs'),note=document.getElementById('cnote'),photo=null;
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var nm=document.getElementById('cn');try{nm.value=localStorage.getItem('chat_name')||localStorage.getItem('edu_name')||''}catch(e){}
if(!window.Live||Live.mode==='off'){note.style.display='';document.getElementById('comp').style.display='none'}
else{
  var admin=false;
  Live.onAuth(function(a){admin=a;draw(last)});
  var last=[];
  Live.onChat(function(list,err){if(err){note.innerHTML='<b>채팅을 불러오지 못했습니다.</b> 총괄 서버 설정을 확인해 주세요.';note.style.display='';return}last=list||[];draw(last)});
  function draw(list){var me=nm.value.trim();box.innerHTML=(list||[]).map(function(m){var t=new Date(m.ts),hm=('0'+t.getHours()).slice(-2)+':'+('0'+t.getMinutes()).slice(-2);
    return '<div class="msg'+(m.name===me&&me?' me':'')+'"><div class="h">'+esc(m.name)+' · '+hm+'</div>'+(m.text?'<div class="x">'+esc(m.text)+'</div>':'')+(m.photo?'<a href="'+m.photo+'" target="_blank"><img src="'+m.photo+'" alt="첨부 사진"></a>':'')+(admin?'<button class="del" data-id="'+m.id+'" type="button">삭제</button>':'')+'</div>'}).join('')||'<div class="note info">아직 메시지가 없습니다. 문제 상황을 사진과 함께 보내 주세요.</div>';
    if(!draw.f){window.scrollTo(0,document.body.scrollHeight);draw.f=1}}
  box.addEventListener('click',function(e){var id=e.target.getAttribute&&e.target.getAttribute('data-id');if(id&&confirm('이 메시지를 삭제할까요?'))Live.deleteChat(id)});
  function shrink(file){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var M=1000,w=im.width,h=im.height,k=Math.min(1,M/Math.max(w,h));var c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);var q=.72,u=c.toDataURL('image/jpeg',q);while(u.length>700000&&q>.3){q-=.1;u=c.toDataURL('image/jpeg',q)}res(u)};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}
  document.getElementById('pf').addEventListener('change',async function(e){var f=e.target.files[0];if(!f)return;try{photo=await shrink(f);var th=document.getElementById('th');th.src=photo;th.style.display=''}catch(x){alert('사진을 불러오지 못했습니다.')}});
  document.getElementById('sd').addEventListener('click',async function(){
    var name=nm.value.trim(),text=document.getElementById('tx').value.trim();
    if(!name){alert('이름(또는 소속)을 입력해 주세요.');nm.focus();return}
    if(!text&&!photo){alert('내용을 쓰거나 사진을 선택해 주세요.');return}
    var b=this;b.disabled=true;
    try{try{localStorage.setItem('chat_name',name)}catch(e){}var m={name:name.slice(0,30),text:text.slice(0,500)};if(photo)m.photo=photo;await Live.sendChat(m);document.getElementById('tx').value='';photo=null;document.getElementById('th').style.display='none';document.getElementById('pf').value='';draw.f=0}
    catch(e){alert('전송하지 못했습니다. 인터넷 연결을 확인하고 다시 시도해 주세요.')}
    b.disabled=false;});
}
});</script><div class="footer">제3회 광산세계야시장 · 협동조합 효성<br>문의 <a href="tel:010-6693-5720">종합상황실 010-6693-5720</a><br>최종 수정 2026. 10. 3.</div></div><script src="../assets/config.js"></script><script src="../assets/schedule.js"></script><script src="../assets/live.js"></script><script src="../assets/capture.js"></script><script src="../assets/app.js"></script><script src="../assets/me.js"></script></body></html>
