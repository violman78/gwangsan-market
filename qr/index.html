<div class="wrap"><div class="crumb"><a href="../">‹ 홈</a></div><div class="hero" style="padding-top:30px"><h1>QR 만들기</h1><p class="lead">사이트 주소를 입력하면 그룹별 QR이 생성됩니다. (인터넷 연결 필요)</p></div><input class="tx" id="base" placeholder="https://사용자명.github.io/저장소명"><button class="btn" type="button" onclick="draw()">QR 생성</button><button class="btn ghost" type="button" onclick="window.print()">인쇄</button><div id="qs"></div><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script>var R=[["", "홈 (공통 입구)"], ["me/", "내 역할 찾기"], ["performers/", "출연팀"], ["parade/", "퍼레이드 참가단체"], ["staff/", "안전 · 경호 · 진행 인력"], ["booth/", "부스 · 구역 운영자"], ["crew/", "제작 파트"], ["edu/", "안전교육"], ["common/", "공통 안내"]];var b=location.href.replace(/\/qr\/.*$/,"");document.getElementById("base").value=b;function draw(){var b=document.getElementById("base").value.replace(/\/$/,"");var z=document.getElementById("qs");z.innerHTML="";R.forEach(function(r){var d=document.createElement("div");d.className="card";d.style.cssText="text-align:center;page-break-inside:avoid";d.innerHTML="<h3>"+r[1]+"</h3><div class=q style=\"display:inline-block;background:#fff;padding:10px\"></div><p style=\"font-size:13px;word-break:break-all\">"+b+"/"+r[0]+"</p>";z.appendChild(d);new QRCode(d.querySelector(".q"),{text:b+"/"+r[0],width:200,height:200})})}draw()</script><div class="footer">제3회 광산세계야시장 · 협동조합 효성<br>문의 <a href="tel:010-6693-5720">종합상황실 010-6693-5720</a><br>최종 수정 2026. 10. 3.</div></div><script src="../assets/app.js"></script><script src="../assets/me.js"></script></body></html>
